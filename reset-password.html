<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Yatta</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        .auth-gradient { background: linear-gradient(135deg, #065F46 0%, #0D9488 40%, #6EE7B7 100%); }
        .input-focus:focus { border-color: #6EE7B7; box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center auth-gradient p-4">

    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 md:p-10 relative">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 group">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md shadow-emerald-500/30">Y</div>
                <span class="text-2xl font-extrabold text-emerald-800">Yatta</span>
            </a>
            <p class="text-sm text-slate-500 mt-2">Buat Password Baru</p>
        </div>

        <form id="resetPasswordForm" class="space-y-4">
            <div id="statusMessage" class="text-sm text-center hidden"></div>
            
            <div>
                <label for="newPassword" class="block text-xs font-semibold text-slate-700 mb-1">Password Baru <span class="text-red-500">*</span></label>
                <input type="password" id="newPassword" placeholder="Minimal 6 karakter" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
                <p class="text-xs text-slate-400 mt-1">Minimal 6 karakter</p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-slate-700 mb-1">Konfirmasi Password <span class="text-red-500">*</span></label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password baru" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
            </div>

            <button type="submit" id="resetBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-emerald-500/25 disabled:opacity-60 disabled:cursor-not-allowed text-sm">
                <i class="fa-solid fa-key mr-2"></i> Ubah Password
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm text-slate-500 hover:text-emerald-600 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Login
            </a>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-600 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        // ✅ Gunakan _supabase konsisten
        const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        const form = document.getElementById('resetPasswordForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMessage');

        // ============================================
        // AMBIL TOKEN DARI URL (HASH FRAGMENT)
        // ============================================
        function getAccessToken() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                return params.get('access_token');
            }
            return null;
        }

        function getRefreshToken() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                return params.get('refresh_token');
            }
            return null;
        }

        // ============================================
        // CEK TOKEN SAAT LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const token = getAccessToken();
            const refreshToken = getRefreshToken();
            
            if (!token) {
                showStatus('❌ Link reset tidak valid atau sudah kadaluarsa. Silakan minta link baru.', 'error');
                resetBtn.disabled = true;
            } else {
                showStatus('✅ Link valid. Silakan buat password baru.', 'success');
                resetBtn.disabled = false;
                
                window._resetToken = token;
                window._refreshToken = refreshToken;
            }
        });

        // ============================================
        // SUBMIT FORM RESET PASSWORD
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const pass = newPassword.value.trim();
            const confirm = confirmPassword.value.trim();

            if (pass.length < 6) {
                showStatus('Password minimal 6 karakter.', 'error');
                return;
            }

            if (pass !== confirm) {
                showStatus('Password dan konfirmasi tidak sama.', 'error');
                return;
            }

            const token = window._resetToken || getAccessToken();
            const refreshToken = window._refreshToken || getRefreshToken();

            if (!token) {
                showStatus('❌ Token tidak valid. Silakan minta link reset ulang.', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';
            showStatus('', '');

            try {
                const { error: sessionError } = await _supabase.auth.setSession({
                    access_token: token,
                    refresh_token: refreshToken || token
                });

                if (sessionError) {
                    console.error('Session error:', sessionError);
                }

                const { error } = await _supabase.auth.updateUser({
                    password: pass
                });

                if (error) {
                    throw error;
                }

                showStatus('✅ Password berhasil diubah! Silakan login.', 'success');
                resetBtn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Berhasil!';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (err) {
                console.error('Reset password error:', err);
                
                if (err.message && err.message.toLowerCase().includes('expired')) {
                    showStatus('❌ Link reset sudah kadaluarsa. Silakan minta link baru.', 'error');
                } else if (err.message && err.message.toLowerCase().includes('session')) {
                    showStatus('❌ Sesi tidak valid. Silakan minta link reset ulang.', 'error');
                } else {
                    showStatus('❌ Gagal mengubah password: ' + err.message, 'error');
                }
                
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fa-solid fa-key mr-2"></i> Ubah Password';
            }
        });

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = `text-sm text-center ${type ? 'block' : 'hidden'} ${
                type === 'success' ? 'text-emerald-600' :
                type === 'error' ? 'text-red-600' :
                ''
            }`;
        }
    </script>

</body>
</html>
