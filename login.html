<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — yatta</title>

    <!-- ============================================ -->
    <!-- FAVICON YATTA -->
    <!-- ============================================ -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <link rel="shortcut icon" href="assets/favicon.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        .auth-gradient { background: linear-gradient(135deg, #065F46 0%, #0D9488 40%, #6EE7B7 100%); }
        .input-focus:focus { border-color: #6EE7B7; box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.3); }
        .modal-enter { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center auth-gradient p-4">

    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 md:p-10 relative">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 group">
                <img src="assets/favicon.png" alt="Yatta" class="h-10 w-10 rounded-xl object-cover shadow-md shadow-emerald-500/30" />
                <span class="text-2xl font-extrabold text-emerald-800">yatta</span>
            </a>
            <p class="text-sm text-slate-500 mt-2">Masuk ke akun Anda</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email <span class="text-red-500">*</span></label>
                <input type="email" id="email" placeholder="Contoh: devankadanialsa@email.com" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password <span class="text-red-500">*</span></label>
                <input type="password" id="password" placeholder="Masukkan password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                    <input type="checkbox" id="rememberMe" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
                    <span>Ingat saya</span>
                </label>
                <a href="#" onclick="openResetModal()" class="text-emerald-600 hover:text-emerald-700 font-semibold text-xs">
                    Lupa password?
                </a>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-emerald-500/25 disabled:opacity-60 disabled:cursor-not-allowed text-sm">
                <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Masuk
            </button>

            <div id="message" class="text-sm text-center hidden"></div>

            <div id="resendContainer" class="hidden text-center mt-2">
                <p class="text-xs text-slate-500">Belum menerima email konfirmasi?</p>
                <button onclick="resendConfirmation()" id="resendBtn" class="text-emerald-600 hover:text-emerald-700 font-semibold text-xs underline mt-1">
                    Kirim Ulang Email Konfirmasi
                </button>
                <div id="resendMessage" class="text-xs text-center mt-1 hidden"></div>
            </div>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-slate-500">Belum punya akun? <a href="register.html" class="font-bold text-emerald-600 hover:text-emerald-700 transition">Daftar Komunitas</a></p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-600 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda</a>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL RESET PASSWORD -->
    <!-- ============================================ -->
    <div id="resetModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 relative shadow-2xl modal-enter">
            <button onclick="closeResetModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-center mb-6">
                <span class="text-emerald-600 text-sm font-bold uppercase tracking-wider">Reset Password</span>
                <h3 class="text-xl font-black text-slate-800 mt-1">Lupa Password?</h3>
                <p class="text-xs text-slate-500 mt-1">Masukkan email Anda, kami akan kirim link reset.</p>
            </div>

            <form id="resetForm" class="space-y-4">
                <div>
                    <label for="resetEmail" class="block text-xs font-semibold text-slate-700 mb-1">Email <span class="text-red-500">*</span></label>
                    <input type="email" id="resetEmail" placeholder="Contoh: devankadanialsa@email.com" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
                </div>

                <button type="submit" id="resetBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-regular fa-paper-plane mr-1"></i> Kirim Link Reset
                </button>

                <div id="resetMessage" class="text-sm text-center hidden"></div>
            </form>
        </div>
    </div>

    <script>
        // ✅ Gunakan _supabase konsisten
        const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // DOM ELEMENTS
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const message = document.getElementById('message');

        // ============================================
        // CEK SESSION & REDIRECT
        // ============================================
        async function checkSessionAndRedirect() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    const { data: profile, error } = await _supabase
                        .from('yata_profiles')
                        .select('role')
                        .eq('id', session.user.id)
                        .single();

                    if (error) {
                        console.error('Error fetching profile:', error);
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    if (profile.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (err) {
                console.error('Session check error:', err);
            }
        }
        checkSessionAndRedirect();

        // ============================================
        // LOGIN FORM SUBMIT
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const rateCheck = checkRateLimit('login');
            if (!rateCheck.allowed) {
                showError(rateCheck.message, '⏳ Terlalu Cepat');
                return;
            }

            const emailValue = email.value.trim();
            const pass = password.value.trim();

            if (!emailValue || !pass) {
                showError('Harap isi email dan password.', 'Validasi Gagal');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';
            message.className = 'text-sm text-center hidden';

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: emailValue,
                    password: pass,
                });

                if (error) {
                    saveRateLimit('login');
                    
                    if (error.message.includes('Invalid login credentials')) {
                        showError('❌ Email atau password salah. Coba lagi.', 'Error');
                    } else if (error.message.includes('Email not confirmed')) {
                        showError('⚠️ Email belum dikonfirmasi. Cek kotak masuk Anda.', 'Warning');
                        showResendButton(emailValue);
                    } else {
                        showError('❌ Terjadi kesalahan: ' + error.message, 'Error');
                    }
                    return;
                }

                if (data && data.user) {
                    message.textContent = '✅ Login berhasil! Mengalihkan...';
                    message.className = 'text-sm text-center text-emerald-600 block';

                    const { data: profile, error: profileError } = await _supabase
                        .from('yata_profiles')
                        .select('role')
                        .eq('id', data.user.id)
                        .single();

                    if (profileError) {
                        console.error('Profile error:', profileError);
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    setTimeout(() => {
                        if (profile.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1500);
                }

            } catch (err) {
                console.error('Login error:', err);
                showError('❌ Terjadi kesalahan: ' + err.message, 'Error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Masuk';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `text-sm text-center ${type ? 'block' : 'hidden'} ${
                type === 'success' ? 'text-emerald-600' :
                type === 'error' ? 'text-red-600' :
                type === 'warning' ? 'text-yellow-600' :
                ''
            }`;
        }

        // ============================================
        // KIRIM ULANG EMAIL KONFIRMASI
        // ============================================
        let resendEmail = '';

        function showResendButton(email) {
            resendEmail = email;
            const container = document.getElementById('resendContainer');
            container.classList.remove('hidden');
            document.getElementById('resendMessage').className = 'text-xs text-center mt-1 hidden';
            document.getElementById('resendBtn').disabled = false;
            document.getElementById('resendBtn').innerHTML = 'Kirim Ulang Email Konfirmasi';
        }

        async function resendConfirmation() {
            if (!resendEmail) return;
            
            const btn = document.getElementById('resendBtn');
            const msg = document.getElementById('resendMessage');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Mengirim...';
            msg.className = 'text-xs text-center mt-1 hidden';
            
            try {
                const { error } = await _supabase.auth.resend({
                    type: 'signup',
                    email: resendEmail
                });
                
                if (error) throw error;
                
                msg.textContent = '✅ Email konfirmasi telah dikirim ulang! Cek kotak masuk Anda.';
                msg.className = 'text-xs text-center mt-1 text-emerald-600 block';
                btn.disabled = false;
                btn.innerHTML = 'Kirim Ulang Email Konfirmasi';
                
            } catch (err) {
                console.error('Resend error:', err);
                msg.textContent = '❌ Gagal mengirim ulang: ' + err.message;
                msg.className = 'text-xs text-center mt-1 text-red-600 block';
                btn.disabled = false;
                btn.innerHTML = 'Kirim Ulang Email Konfirmasi';
            }
        }

        // ============================================
        // RESET PASSWORD MODAL
        // ============================================
        function openResetModal() {
            document.getElementById('resetModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            document.getElementById('resetForm').reset();
            document.getElementById('resetMessage').className = 'text-sm text-center hidden';
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('resetBtn').innerHTML = '<i class="fa-regular fa-paper-plane mr-1"></i> Kirim Link Reset';
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('resetModal').addEventListener('click', function(e) {
            if (e.target === this) closeResetModal();
        });

        // ============================================
        // RESET PASSWORD FORM SUBMIT (YANG DIPERBAIKI)
        // ============================================
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('resetBtn');

            if (!email) {
                showError('Harap isi email.', 'Validasi Gagal');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showError('Email tidak valid.', 'Validasi Gagal');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Mengirim...';
            document.getElementById('resetMessage').className = 'text-sm text-center hidden';

            try {
                // ✅ PERBAIKAN: redirectTo menggunakan URL absolut
                const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://yata-gold.vercel.app/reset-password.html'
                });

                if (error) {
                    if (error.message.includes('User not found')) {
                        showError('❌ Email tidak ditemukan. Pastikan email terdaftar.', 'Error');
                    } else {
                        showError('❌ Gagal mengirim link reset: ' + error.message, 'Error');
                    }
                    return;
                }

                document.getElementById('resetMessage').textContent = '✅ Link reset telah dikirim ke email Anda. Cek kotak masuk (termasuk spam)!';
                document.getElementById('resetMessage').className = 'text-sm text-center text-emerald-600 block';
                document.getElementById('resetEmail').value = '';

                setTimeout(() => {
                    closeResetModal();
                }, 3000);

            } catch (err) {
                console.error('Reset password error:', err);
                showError('❌ Terjadi kesalahan: ' + err.message, 'Error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-regular fa-paper-plane mr-1"></i> Kirim Link Reset';
            }
        });
    </script>

</body>
</html>
