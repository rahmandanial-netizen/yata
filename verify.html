<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifikasi Sertifikat - YATTA</title>

    <!-- ============================================ -->
    <!-- FAVICON YATTA -->
    <!-- ============================================ -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <link rel="shortcut icon" href="assets/favicon.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6EE7B7',
                        primaryDark: '#065F46',
                        gold: '#D4AF37',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .verify-card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 520px;
            margin: 0 auto;
            text-align: center;
        }
        
        .verify-icon {
            font-size: 72px;
            margin-bottom: 12px;
            display: block;
        }
        
        .verify-card .status-valid { color: #065F46; }
        .verify-card .status-invalid { color: #991B1B; }
        .verify-card .status-pending { color: #92400E; }
        
        .cert-detail {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 20px;
            text-align: left;
            margin-top: 16px;
        }
        
        .cert-detail .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .cert-detail .detail-row:last-child { border-bottom: none; }
        .cert-detail .label { color: #64748b; font-weight: 500; }
        .cert-detail .value { color: #0f172a; font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
        
        .verify-shield {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 12px;
        }
        .shield-valid { background: #D1FAE5; color: #065F46; }
        .shield-invalid { background: #FEE2E2; color: #991B1B; }
        .shield-pending { background: #FEF3C7; color: #92400E; }
        
        .print-btn { transition: all 0.3s ease; }
        .print-btn:hover { transform: translateY(-2px); }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #065F46;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .verify-card { padding: 24px 16px; }
            .verify-icon { font-size: 48px; }
            .cert-detail .detail-row { flex-direction: column; gap: 2px; padding: 8px 0; }
            .cert-detail .value { max-width: 100%; text-align: left; }
        }

        @media print {
            body { background: white !important; padding: 20px !important; }
            .verify-card { box-shadow: none !important; border: 2px solid #D4AF37 !important; }
            .print-btn, .no-print { display: none !important; }
            .cert-detail .detail-row { break-inside: avoid; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-slate-50 to-white p-4">

    <div class="max-w-2xl w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 group">
                <img src="assets/favicon.png" alt="YATTA" class="h-12 w-12 rounded-xl object-cover shadow-md shadow-emerald-500/30" />
                <span class="text-2xl font-extrabold text-emerald-800">YATTA</span>
                <span class="text-xs text-emerald-600 font-semibold bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">Verifikasi</span>
            </a>
            <p class="text-sm text-slate-500 mt-2">Cek keaslian sertifikat YATTA</p>
        </div>

        <!-- Hasil Verifikasi -->
        <div id="verificationResult" class="verify-card">
            <div class="flex flex-col items-center justify-center py-8">
                <div class="spinner"></div>
                <p class="text-slate-500 text-sm">Memverifikasi sertifikat...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="index.html" class="text-sm text-slate-400 hover:text-emerald-600 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
            </a>
            <span class="text-slate-300 hidden sm:inline">•</span>
            <a href="certificates.html" class="text-sm text-slate-400 hover:text-emerald-600 transition">
                <i class="fa-regular fa-certificate mr-1"></i> Lihat Sertifikat Saya
            </a>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return { cert: params.get('cert'), user: params.get('user') };
        }

        function formatDate(dateString) {
            if (!dateString) return 'Tanggal tidak tersedia';
            try {
                return new Date(dateString).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
            } catch { return dateString; }
        }

        async function verifyCertificate() {
            const { cert, user } = getParams();
            const resultContainer = document.getElementById('verificationResult');

            if (!cert || !user) {
                resultContainer.innerHTML = `
                    <div>
                        <span class="verify-icon">❌</span>
                        <h2 class="text-2xl font-black text-red-600">Link Tidak Valid</h2>
                        <p class="text-slate-500 text-sm mt-2">Parameter verifikasi tidak lengkap.</p>
                        <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
                            <a href="index.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                <i class="fa-solid fa-house mr-1"></i> Kembali ke Beranda
                            </a>
                            <a href="certificates.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                <i class="fa-regular fa-certificate mr-1"></i> Sertifikat Saya
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            console.log('🔍 Verifikasi sertifikat:', { cert, user });

            try {
                const { data: certificate, error } = await _supabase
                    .from('yata_certificates')
                    .select(`*, user:user_id (full_name, username, email)`)
                    .eq('certificate_number', cert)
                    .eq('user_id', user)
                    .maybeSingle();

                console.log('📜 Hasil query:', certificate);
                if (error) console.error('❌ Error:', error);

                if (!certificate) {
                    resultContainer.innerHTML = `
                        <div>
                            <span class="verify-icon">❌</span>
                            <h2 class="text-2xl font-black text-red-600">Sertifikat Tidak Ditemukan</h2>
                            <p class="text-slate-500 text-sm mt-2">Sertifikat dengan nomor <strong>${cert}</strong> tidak terdaftar.</p>
                            <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
                                <a href="index.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                    <i class="fa-solid fa-house mr-1"></i> Beranda
                                </a>
                                <a href="certificates.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                    <i class="fa-regular fa-certificate mr-1"></i> Sertifikat Saya
                                </a>
                            </div>
                        </div>
                    `;
                    return;
                }

                const isClaimed = certificate.is_claimed === true;
                const statusText = isClaimed ? 'VALID' : 'BELUM DIKLAIM';
                const statusColor = isClaimed ? 'text-emerald-600' : 'text-amber-600';
                const statusIcon = isClaimed ? '✅' : '⏳';
                const shieldClass = isClaimed ? 'shield-valid' : 'shield-pending';

                const typeMap = { onboarding: 'Onboarding YATTA', mentoring: 'Kelas Mentoring', penulis: 'Penulis', mentor: 'Mentor' };
                const typeName = typeMap[certificate.certificate_type] || 'Program YATTA';
                const programName = certificate.session?.title || typeName;

                resultContainer.innerHTML = `
                    <div>
                        <span class="verify-icon">${statusIcon}</span>
                        <h2 class="text-2xl font-black ${statusColor}">${statusText}</h2>
                        <p class="text-sm text-slate-500 mt-1">Sertifikat terdaftar di sistem YATTA</p>
                        <span class="verify-shield ${shieldClass}">
                            <i class="fa-regular fa-shield-check"></i> ${isClaimed ? 'Terverifikasi' : 'Menunggu Klaim'}
                        </span>
                        <div class="cert-detail">
                            <div class="detail-row"><span class="label">Nomor</span><span class="value">${cert}</span></div>
                            <div class="detail-row"><span class="label">Nama</span><span class="value">${certificate.user?.full_name || 'Member'}</span></div>
                            <div class="detail-row"><span class="label">Username</span><span class="value">@${certificate.user?.username || 'username'}</span></div>
                            <div class="detail-row"><span class="label">Program</span><span class="value">${programName}</span></div>
                            <div class="detail-row"><span class="label">Tipe</span><span class="value">${typeName}</span></div>
                            <div class="detail-row"><span class="label">Tanggal</span><span class="value">${formatDate(certificate.issued_at)}</span></div>
                            <div class="detail-row"><span class="label">Status</span><span class="value ${isClaimed ? 'text-emerald-600' : 'text-amber-600'}">${isClaimed ? '✅ Diklaim' : '⏳ Belum Diklaim'}</span></div>
                            <div class="detail-row"><span class="label">Penandatangan</span><span class="value">${certificate.signatory_name || 'Abd. Rahman Danial'}</span></div>
                            <div class="detail-row"><span class="label">Jabatan</span><span class="value">${certificate.signatory_title || 'Founder & CEO YATTA'}</span></div>
                        </div>
                        <div class="mt-4 flex flex-wrap items-center justify-center gap-3 text-xs text-slate-400">
                            <span><i class="fa-regular fa-clock mr-1"></i> Diverifikasi ${new Date().toLocaleDateString('id-ID')}</span>
                            <span>•</span>
                            <span><i class="fa-regular fa-shield-check mr-1"></i> YATTA v1.0</span>
                        </div>
                        <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
                            <a href="https://yata-gold.vercel.app" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                <i class="fa-solid fa-globe mr-1"></i> Kunjungi YATTA
                            </a>
                            <button onclick="window.print()" class="print-btn bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                <i class="fa-solid fa-print mr-1"></i> Cetak
                            </button>
                            <a href="certificates.html" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                <i class="fa-regular fa-certificate mr-1"></i> Sertifikat Saya
                            </a>
                        </div>
                        <div class="mt-4 p-3 bg-emerald-50/50 border border-emerald-200 rounded-xl">
                            <p class="text-xs text-emerald-700"><i class="fa-regular fa-circle-check mr-1"></i> Sertifikat resmi YATTA.</p>
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error('❌ Verification error:', err);
                resultContainer.innerHTML = `
                    <div>
                        <span class="verify-icon">❌</span>
                        <h2 class="text-2xl font-black text-red-600">Terjadi Kesalahan</h2>
                        <p class="text-slate-500 text-sm mt-2">${err.message}</p>
                        <button onclick="verifyCertificate()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Coba Lagi
                        </button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', verifyCertificate);
    </script>

</body>
</html>
