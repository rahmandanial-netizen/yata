<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Komunitas — Yatta</title>

    <!-- ============================================ -->
    <!-- FAVICON YATTA -->
    <!-- ============================================ -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <link rel="shortcut icon" href="assets/favicon.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        .auth-gradient { background: linear-gradient(135deg, #065F46 0%, #0D9488 40%, #6EE7B7 100%); }
        .input-focus:focus { border-color: #6EE7B7; box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center auth-gradient p-4">

    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 md:p-10 relative">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 group">
                <img src="assets/favicon.png" alt="Yatta" class="h-10 w-10 rounded-xl object-cover shadow-md shadow-emerald-500/30" />
                <span class="text-2xl font-extrabold text-emerald-800">Yatta</span>
            </a>
            <p class="text-sm text-slate-500 mt-2">Daftar Komunitas Yatta</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label for="fullName" class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap <span class="text-red-500">*</span></label>
                <input type="text" id="fullName" placeholder="Contoh: Devanka Danialsa" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
            </div>

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Username <span class="text-red-500">*</span></label>
                <input type="text" id="username" placeholder="Contoh: devankadanialsa" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
                <p class="text-xs text-slate-400 mt-1">Minimal 3 karakter, tanpa spasi</p>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email <span class="text-red-500">*</span></label>
                <input type="email" id="email" placeholder="Contoh: devankadanialsa@email.com" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password <span class="text-red-500">*</span></label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
                <p class="text-xs text-slate-400 mt-1">Minimal 6 karakter</p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-slate-700 mb-1">Konfirmasi Password <span class="text-red-500">*</span></label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none input-focus text-sm" />
            </div>

            <button type="submit" id="registerBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-emerald-500/25 disabled:opacity-60 disabled:cursor-not-allowed text-sm">
                <i class="fa-solid fa-user-plus mr-2"></i> Daftar Komunitas
            </button>

            <div id="message" class="text-sm text-center hidden"></div>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-slate-500">Sudah punya akun? <a href="login.html" class="font-bold text-emerald-600 hover:text-emerald-700 transition">Masuk di sini</a></p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-600 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // DOM ELEMENTS
        const form = document.getElementById('registerForm');
        const fullName = document.getElementById('fullName');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const message = document.getElementById('message');

        username.addEventListener('input', () => {
            username.value = username.value.replace(/\s/g, '');
        });

        async function checkSession() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    const { data: profile } = await _supabase
                        .from('yata_profiles')
                        .select('role')
                        .eq('id', session.user.id)
                        .single();

                    if (profile?.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (err) {
                console.error('Session check error:', err);
            }
        }
        checkSession();

        // ============================================
        // GENERATE MEMBER ID DENGAN LEVEL
        // ============================================
        async function generateMemberIdWithLevel(levelKey) {
            const prefixMap = {
                'tamu': 'Yatta-T',
                'penulis': 'Yatta-P',
                'penulis_profesional': 'Yatta-PP',
                'mentor': 'Yatta-M'
            };
            
            const prefix = prefixMap[levelKey] || 'Yatta-T';
            
            const now = new Date();
            const tanggal = String(now.getDate()).padStart(2, '0');
            const bulan = String(now.getMonth() + 1).padStart(2, '0');
            const tahun = String(now.getFullYear()).slice(-2);
            const dateSuffix = `${tanggal}${bulan}${tahun}`;
            
            try {
                const { count, error } = await _supabase
                    .from('yata_profiles')
                    .select('*', { count: 'exact', head: true })
                    .ilike('member_id', `${prefix}-%`);
                
                if (error) {
                    console.error('Error counting members:', error);
                    const timestamp = String(Date.now()).slice(-2);
                    return `${prefix}-${timestamp}${dateSuffix}`;
                }
                
                const number = (count || 0) + 1;
                const urutan = number < 10 ? `0${number}` : String(number);
                
                return `${prefix}-${urutan}${dateSuffix}`;
                
            } catch (err) {
                console.error('Generate member ID error:', err);
                const timestamp = String(Date.now()).slice(-2);
                return `${prefix}-${timestamp}${dateSuffix}`;
            }
        }

        // ============================================
        // FUNGSI BUAT PROFIL
        // ============================================
        async function createProfile(userId, username, fullName, email) {
            try {
                const profileData = {
                    id: userId,
                    username: username,
                    full_name: fullName,
                    email: email,
                    role: 'member',
                    member_level: 'Tamu',
                    points: 0,
                    created_at: new Date().toISOString()
                };

                console.log('📝 Mencoba insert profil:', profileData);

                const { error: profileError } = await _supabase
                    .from('yata_profiles')
                    .insert([profileData]);

                if (profileError) {
                    console.error('❌ Profile Error:', profileError);
                    console.error('❌ Code:', profileError.code);
                    console.error('❌ Message:', profileError.message);
                    
                    // TAMPILKAN ERROR KE USER
                    let errorMessage = 'Gagal menyimpan profil. ';
                    if (profileError.code === '23505') {
                        if (profileError.details?.includes('username')) {
                            errorMessage += 'Username sudah digunakan. Silakan gunakan username lain.';
                        } else if (profileError.details?.includes('email')) {
                            errorMessage += 'Email sudah terdaftar. Silakan gunakan email lain.';
                        } else {
                            errorMessage += 'Data duplikat ditemukan.';
                        }
                    } else {
                        errorMessage += profileError.message;
                    }
                    
                    showError(errorMessage, 'Error');
                    
                    // HAPUS AUTH AGAR TIDAK ORPHAN
                    try {
                        await _supabase.auth.admin.deleteUser(userId);
                        console.log('🧹 Akun auth dihapus karena profil gagal');
                    } catch (delErr) {
                        console.warn('⚠️ Gagal menghapus akun auth:', delErr);
                    }
                    return false;
                }

                console.log('✅ Profil berhasil disimpan!');

                // GENERATE MEMBER ID
                try {
                    const newMemberId = await generateMemberIdWithLevel('tamu');
                    await _supabase
                        .from('yata_profiles')
                        .update({ member_id: newMemberId })
                        .eq('id', userId);
                    console.log('✅ Member ID generated:', newMemberId);
                } catch (err) {
                    console.error('Generate member_id error:', err);
                }

                // KIRIM NOTIFIKASI SELAMAT DATANG
                try {
                    const { data: notifData, error: notifError } = await _supabase
                        .from('yata_notifications')
                        .insert([{
                            title: '🎉 Selamat Datang di Yatta!',
                            content: `Halo ${fullName}! Selamat bergabung di Yatta. Mulai tulis karyamu, temukan komunitas, dan ikuti kampanye literasi. Jangan lupa lengkapi profilmu!`,
                            type: 'success'
                        }])
                        .select()
                        .single();

                    if (!notifError && notifData) {
                        await _supabase
                            .from('yata_user_notifications')
                            .insert([{
                                notification_id: notifData.id,
                                user_id: userId,
                                is_read: false
                            }]);
                        console.log('✅ Notifikasi selamat datang terkirim');
                    }
                } catch (notifErr) {
                    console.error('Send welcome notification error:', notifErr);
                }

                return true;

            } catch (err) {
                console.error('Create profile error:', err);
                return false;
            }
        }

        // ============================================
        // SUBMIT FORM
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const rateCheck = checkRateLimit('register');
            if (!rateCheck.allowed) {
                showError(rateCheck.message, '⏳ Terlalu Cepat');
                return;
            }

            const name = fullName.value.trim();
            const user = username.value.trim().toLowerCase();
            const emailValue = email.value.trim();
            const pass = password.value;
            const confirmPass = confirmPassword.value;

            if (!name || !user || !emailValue || !pass || !confirmPass) {
                showError('Semua kolom wajib diisi!', 'Validasi Gagal');
                return;
            }

            if (user.length < 3) {
                showError('Username minimal 3 karakter.', 'Validasi Gagal');
                return;
            }

            if (!emailValue.includes('@') || !emailValue.includes('.')) {
                showError('Email tidak valid.', 'Validasi Gagal');
                return;
            }

            if (pass.length < 6) {
                showError('Password minimal 6 karakter.', 'Validasi Gagal');
                return;
            }

            if (pass !== confirmPass) {
                showError('Password dan konfirmasi tidak sama.', 'Validasi Gagal');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mendaftar...';
            message.className = 'text-sm text-center hidden';

            try {
                // ============================================
                // STEP 1: REGISTER KE AUTH DENGAN EMAIL CONFIRMATION
                // ============================================
                const { data: authData, error: authError } = await _supabase.auth.signUp({
                    email: emailValue,
                    password: pass,
                    options: {
                        data: {
                            full_name: name,
                            username: user,
                        },
                        // 🔥 URL REDIRECT SETELAH KONFIRMASI EMAIL
                        emailRedirectTo: 'https://yata-gold.vercel.app/login.html'
                    }
                });

                if (authError) {
                    console.error('❌ Auth Error:', authError);
                    if (authError.message.includes('User already registered')) {
                        showError('Email sudah terdaftar. Silakan login.', 'Error');
                    } else {
                        showError('Gagal daftar: ' + authError.message, 'Error');
                    }
                    return;
                }

                if (!authData || !authData.user) {
                    showError('Gagal membuat akun. Silakan coba lagi.', 'Error');
                    return;
                }

                console.log('✅ Auth berhasil:', authData.user.id);

                // ============================================
                // STEP 2: CEK APAKAH EMAIL PERLU KONFIRMASI
                // ============================================
                const emailConfirmed = authData.user.confirmed_at !== null;
                console.log('📧 Email confirmed:', emailConfirmed);

                // ============================================
                // STEP 3: BUAT PROFIL (TETAP DIBUAT!)
                // ============================================
                const profileCreated = await createProfile(
                    authData.user.id,
                    user,
                    name,
                    emailValue
                );

                if (!profileCreated) {
                    return;
                }

                saveRateLimit('register');

                // ============================================
                // STEP 4: TAMPILKAN PESAN SESUAI STATUS
                // ============================================
                if (!emailConfirmed) {
                    // 🔥 EMAIL BELUM DIKONFIRMASI - TAMPILKAN PESAN VERIFIKASI
                    message.innerHTML = `
                        ✅ Pendaftaran berhasil!<br>
                        <span class="text-sm text-slate-500">
                            Silakan cek <strong>email Anda</strong> (termasuk folder SPAM) 
                            untuk verifikasi sebelum login.
                        </span>
                        <br><br>
                        <span class="text-xs text-slate-400">
                            🔗 Link verifikasi akan dikirim ke: <strong>${emailValue}</strong>
                        </span>
                    `;
                    message.className = 'text-sm text-center text-emerald-600 block';
                    
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Daftar Komunitas';
                    
                    // RESET FORM
                    form.reset();
                    
                } else {
                    // EMAIL SUDAH DIKONFIRMASI (LANGSUNG LOGIN)
                    message.textContent = '✅ Pendaftaran berhasil! Mengalihkan ke halaman login...';
                    message.className = 'text-sm text-center text-emerald-600 block';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }

            } catch (err) {
                console.error('❌ Register error:', err);
                showError('Terjadi kesalahan: ' + err.message, 'Error');
            } finally {
                // JANGAN RESET BUTTON JIKA EMAIL BELUM DIKONFIRMASI
                // (SUDAH DIATUR DI ATAS)
            }
        });

        function showError(message, title = 'Terjadi Kesalahan') {
            const msg = document.getElementById('message');
            msg.textContent = title + ': ' + message;
            msg.className = 'text-sm text-center text-red-600 block';
            
            // RESET BUTTON
            registerBtn.disabled = false;
            registerBtn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Daftar Komunitas';
        }
    </script>

</body>
</html>
